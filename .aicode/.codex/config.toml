# Alternative config for sync work.
# This is to be placed into the user-level
# directory, that is, into `CODEX_HOME`.
# Then the untrusted entry must be added
# as specified below. Then codex-cli may be
# started in this repo as workdir, and the
# async config from `<this_repo>/.codex/
# config.toml` will not load, which is 
# what we want.
#
# Signed off: Pavel

# OpenAI Codex (v0.163.0)
model = "gpt-6-sol"
service_tier = "default"
model_reasoning_effort = "xhigh"
personality = "none"
web_search = "disabled"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"
# > To preserve the stricter command-approval rule,
# > omit an explicit approval_policy and
# > add a project entry to your
# > user-level `~/.codex/config.toml`
# > ```
# > [projects."/path/to/project"]
# > trust_level = "untrusted"
# > ```
# https://learn.chatgpt.com/docs/agent-approvals-security

[sandbox_workspace_write]
network_access = false

[agents]
enabled = false

[features]
plugins = false
remote_plugin = false
plugin_sharing = false
recommended_plugins = false
apps = false
skill_mcp_dependency_install = false
multi_agent = false

[apps._default]
enabled = false
destructive_enabled = false
open_world_enabled = false

[tui]
# disable animations in astra
#whimsy = false
animations = false
screen_reader_detection_done = true
