description = '''Usage: pixi run -e detour-ai-augment table-docx '{"ktp.first_name":"Antoine","ktp.last_name":"Guisan"}' (uses current Dashboard storage)'''
cmd = """
python -c '
import json
import os
import subprocess
import sys
from enum import StrEnum
from io import BytesIO
from pathlib import Path

from docx import Document
from docx.oxml import OxmlElement
from docx.oxml.ns import qn
from docx.shared import Cm


class TableColumn(StrEnum):
    RESEARCHER_VARIABLE = "researcher_variable"
    MANUAL_TABLE_1_VALUE = "manual_table_1_value"
    AI_AUGMENT_VALUE = "ai_augment_value"
    AI_AUGMENT_FOOTNOTES = "ai_augment_footnotes"


completed = subprocess.run(
    ["pixi", "run", "-e", "detour-ai-augment", "table-markdown", sys.argv[1]],
    check=True,
    stdout=subprocess.PIPE,
    text=True,
)
markdown_path = Path(completed.stdout.strip())
config_path = Path(os.environ.get("AI_AUGMENT_EVAL_CONFIG", "config_ai_augment.json"))
config = json.loads(config_path.read_text(encoding="utf-8"))
html = subprocess.check_output(
    ["pandoc", "-f", "markdown", "-t", "html"],
    input=markdown_path.read_bytes(),
)
document = Document(BytesIO(subprocess.check_output(
    ["pandoc", "-f", "html", "-t", "docx",
     "--reference-doc", str(Path(config["pandoc_reference_docx"]))],
    input=html,
)))
widths = tuple(Cm(width) for width in (3.3, 4.4, 4.4, 4.4))
for table in document.tables:
    if len(table.columns) != 4 or table.cell(0, 0).text != TableColumn.RESEARCHER_VARIABLE:
        continue
    table.autofit = False
    for column, width in zip(table.columns, widths):
        column.width = width
    for row in table.rows:
        for cell, width in zip(row.cells, widths):
            cell.width = width
    borders = table._tbl.tblPr.find(qn("w:tblBorders"))
    if borders is None:
        borders = OxmlElement("w:tblBorders")
        table._tbl.tblPr.append(borders)
    for edge in ("top", "left", "bottom", "right", "insideH", "insideV"):
        element = borders.find(qn(f"w:{edge}"))
        if element is None:
            element = OxmlElement(f"w:{edge}")
            borders.append(element)
        for attribute, value in (("val", "single"), ("sz", "8"), ("color", "000000")):
            element.set(qn(f"w:{attribute}"), value)
output = markdown_path.with_suffix(".docx")
document.save(output)
print(output.resolve())
'
"""
cwd = "."

