# =================================
# Broadly compatible pyproject.toml
# =================================

[project]
name = "2026-01-02_enrich_full_df"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
authors = [{name = "Pavel Zhelnov", email = "pzhelnov@p1m.org"}]
# the below are treated by Pixi as PyPi deps
dependencies = [
    "pandas>=2.3.3,<3",
    "rich>=14.2.0,<15",
    "psutil>=7.2.1,<8",
    "python-docx>=1.2.0,<2",
    "click>=8.3.1,<9",
    "pydantic>=2.12.5,<3",
    "pytest>=9.0.2,<10",
    "lxml>=6.0.2,<7",
    "ruff>=0.14.14,<0.15",
    "mypy>=1.19.1,<2",
    "requests>=2.32.5,<3",
    "types-requests>=2.32.4.20260107,<3",
    "openpyxl>=3.1.5,<4",
    "pytest-cov>=7.0.0,<8",
    "python-dotenv>=1.2.2,<2",
]
# the below are pip etc compatible groups
[dependency-groups]
detour-mode0-econ-stats = [
  "kaleido==0.2.1",
  "plotly==6.6.0",
]
detour-ai-augment = [
  "fastapi==0.140.0",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "nicegui==3.13.0",
  "playwright==1.62.0",
]

# ============
# Tool configs
# ============

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "tests/test_detours",  # can run via `pixi run test tests/test_detours`
    "src/detours/detour_ai_augment/tests",
]
markers = [
    "slow: long-running integration tests against real config/data",
    "real_api: live-network tests against external APIs; run explicitly with -m real_api",
]

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  "E731",  # allows to assign a `lambda` expressions instead of using a `def`,
           # which may be neat for defining a global executable rule
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = [
    "src/detours/detour_ai_augment/src/llm_inference_api/sample_deploy",
]

# ==================
# Pixi Environments
# ==================

# "default" environment goes without saying
[tool.pixi.environments.default]
no-default-feature = false
features = []

# The features themselves are defined below per detour
[tool.pixi.environments.detour-mode0-econ-stats]
no-default-feature = false
features = [
  "detour-mode0-econ-stats",
]
[tool.pixi.environments.detour-ai-augment]
no-default-feature = false
features = [
  "detour-ai-augment",
]

# =======================
# Default: Infrastructure
# =======================

# Supported deployments
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

# Conda dependencies
[tool.pixi.dependencies]
python = "==3.14.2"
duckdb = "==1.5.1"

# ======================
# Default: Generic tasks
# ======================

[tool.pixi.tasks.test]  # flexible task for downstream use
args = [
  { arg = "module_name" },  # required
  { arg = "marker", default = "" },
]
# centralizes pytest behaviour
cmd = """
pytest -vv -srA {{ module_name }} \
  {% if marker %}-m "{{ marker }}"{% endif %}
"""
cwd = "."

# Mostly unused really
[tool.pixi.tasks.module]
args = [
  { arg = "module_name", default = "src.repl" },
  { arg = "config_path", default = "config.repl.json" },
]
cmd = """
{% if module_name == "src.repl" %}
python -m src.repl --config "{{ config_path }}" --new --yes --non-interactive
{% endif %}
"""
cwd = "."

[tool.pixi.tasks.ruff]
args = [
  { arg = "module_names", default = "src tests" },
]
cmd = "ruff check {{ module_names }}"
cwd = "."

[tool.pixi.tasks.mypy]
args = [
  { arg = "module_names", default = "src tests" },
]
cmd = "mypy {{ module_names }}"
cwd = "."

[tool.pixi.tasks.lint]
depends-on = ["ruff", "mypy"]  # whatever is default

# ====================================
# Default: Tasks for actual execution
# ====================================
[tool.pixi.tasks.repl]
args = [
  { arg = "config_path", default = "config.repl.json" },
]
cmd = "python -m src.repl --config \"{{ config_path }}\" --new --yes --non-interactive"
cwd = "."

[tool.pixi.tasks.duckdb-ui]
args = [
  { arg = "input_path", default = "data/scisci_process.duckdb" },
  { arg = "config_path", default = "config.repl.json" },
]
cmd = """
python -c '
import sys, duckdb
from pathlib import Path
from src.helpers.duckdb_extensions import load_duckdb_extension_from_config_path
read_only = True
input_path = sys.argv[1]
config_path = Path(sys.argv[2])
# using chr(39) to avoid conflict with outer single quote
input_path_safe = chr(39) + input_path.replace(chr(39), chr(39) + chr(39)) + chr(39)
if not read_only:
    sys.exit(
      "Write access is not configured for this command. "
      "Review the run command manually if you want to "
      "open DuckDB UI with write access."
    )
con = duckdb.connect(":memory:")
try:
  con.sql(f"ATTACH {input_path_safe} AS db (READ_ONLY)")
  load_duckdb_extension_from_config_path(con, "splink_udfs", config_path)
except:
  if input_path.lower().endswith(".parquet"):
    con.sql("CREATE OR REPLACE VIEW parquet AS "
            f"SELECT * FROM read_parquet({input_path_safe});")
  else:
    raise
con.sql("CALL start_ui();")
input(
  f"DuckDB UI running on {input_path!r} in read-only mode. "
  "Press Enter to stop..."
)
' "{{ input_path }}" "{{ config_path }}"
"""
cwd = "."

# ===============================
# Default: Tasks for actual tests
# ===============================

[tool.pixi.tasks.test-repl]
depends-on = [
  { task = "test", args = ["."] },  # whatever is in pytest.ini_options
  # no slow tests so far - otherwise exits 1 here
  # { task = "test", args = [".", "slow"] },
  { task = "test", args = [".", "real_api"] },
]

# The tasks themselves are specified below per detour
[tool.pixi.tasks.test-detours]
depends-on = [
    "test-detour-step4-breakdown",
    "test-detour-mode3-pgf-stats",
    "test-detour-mode0-econ-stats",
    "test-detour-ai-augment-root",
]

[tool.pixi.tasks.pre-commit]
depends-on = [
  { task = "lint" },  # lint all across repo
  { task = "test-repl" },
  { task = "test-detours" },
]

[tool.pixi.tasks.pre-commit-repl]
depends-on = ["lint", "test-repl"]

[tool.pixi.tasks.pre-commit-detours]
depends-on = ["lint", "test-detours"]

[tool.pixi.tasks.cov]
cmd = "pytest -vv --cov=src --cov-report=term-missing --cov-report=xml"
cwd = "."

# ========================
# Detour: Step 4 breakdown
# ========================

[tool.pixi.tasks.test-detour-step4-breakdown]
depends-on = [
  { task = "test", args = ["tests/test_detours/test_detour_step4_breakdown.py"], environment = "default" },
  # no tests marked slow in other detour tests
  { task = "test", args = ["tests/test_detours/test_detour_step4_breakdown.py", "slow"], environment = "default" },
]

# ==========================
# Detour: Mode 3 P(gf) stats
# ==========================

[tool.pixi.tasks.test-detour-mode3-pgf-stats]
depends-on = [
  { task = "test", args = ["tests/test_detours/test_detour_mode3_pgf_stats.py"], environment = "default" },
]

# ==========================
# Detour: Mode 0 econ stats
# ==========================

[tool.pixi.feature.detour-mode0-econ-stats.tasks]
test-detour-mode0-econ-stats = [
  { task = "test", args = ["tests/test_detours/test_detour_mode0_econ_stats.py"], environment = "detour-mode0-econ-stats" },
]

# ==================
# Detour: AI Augment
# ==================

# Feature tasks auto execute in its dedicated environment;
# above this didn't apply because we were using the "test"
# task defined within the default feature, and so we needed
# to specify the environment to use.

[tool.pixi.feature.detour-ai-augment.tasks]
serve = "python -m src.detours.detour_ai_augment.src.backend.api --config config_ai_augment.json"
dashboard = "python -m src.detours.detour_ai_augment.src.control_centre.dashboard.ui"
# provision a worktree first:
# git worktree add --detach /tmp/detour-api-9a187d3 9a187d3fc497bef6d1568b885b33f0a834607d22
# cp ./.env /tmp/detour-api-9a187d3; mkdir -p /tmp/detour-api-9a187d3/tmp && cp ./tmp/sheikh.jsonl /tmp/detour-api-9a187d3/tmp/sheikh.jsonl
#serve = "cd /tmp/detour-api-9a187d3 && uvicorn src.detours.detour_ai_augment.src.backend.api:app --host 0.0.0.0 --port 8000"
# don't forget to clean up afterwards:
# rm -f /tmp/detour-api-9a187d3
test-detour-ai-augment-root = """
sudo env \
  APPENDWATCH_SCRIPT="$PIXI_PROJECT_ROOT/src/detours/detour_ai_augment/src/control_centre/appendwatch/appendwatch.py" \
  APPENDWATCH_PYTHON="/usr/bin/python3" \
  PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
  "$CONDA_PREFIX/bin/python" -m pytest -vv -srA \
  src/detours/detour_ai_augment/tests
"""
