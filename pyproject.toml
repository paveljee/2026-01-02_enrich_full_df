[project]
name = "2026-01-02_enrich_full_df"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
authors = [{name = "Pavel Zhelnov", email = "pzhelnov@p1m.org"}]
dependencies = [
    "pandas>=2.3.3,<3",
    "duckdb>=1.4.3,<2",
    "rich>=14.2.0,<15",
    "psutil>=7.2.1,<8",
    "python-docx>=1.2.0,<2",
    "click>=8.3.1,<9",
    "pydantic>=2.12.5,<3",
    "pytest>=9.0.2,<10",
    "lxml>=6.0.2,<7",
    "ruff>=0.14.14,<0.15",
    "mypy>=1.19.1,<2",
    "requests>=2.32.5,<3",
    "types-requests>=2.32.4.20260107,<3",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tool.pixi.tasks.test]
args = [
  { "arg" = "module_name", "default" = "." },
]
cmd = "pytest -vv -s {{ module_name }}"
cwd = "."

[tool.pixi.tasks.module]
args = [
  { "arg" = "module_name", "default" = "." },
]
cmd = """
{% if module_name == "pkg_20251223_word_tables" %}
python {{ module_name }} process \
    data/manual_extractions \
    data/samples \
    --output-dir ./.output \
    --output-format txt
{% endif %}
"""
cwd = "."

[tool.pixi.tasks.ruff]
cmd = "ruff check pkg_20251223_word_tables"
cwd = "."

[tool.pixi.tasks.mypy]
cmd = "mypy pkg_20251223_word_tables"
cwd = "."

[tool.pixi.tasks.pre-commit]
depends-on = ["ruff", "mypy", "test"]

[tool.pytest.ini_options]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
