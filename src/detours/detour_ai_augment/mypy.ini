[mypy]
python_version = 3.14
plugins = pydantic.mypy
strict = true

exclude = (?x)(
    ^src/detours/detour_ai_augment/protected/src/llm_inference_api/sample_deploy/
    | ^src/detours/detour_ai_augment/protected/tests/bdd/
  )

# Every AI-augment module is an explicit input to this task. Other first-party
# modules imported through the top-level src package are checked separately by
# the repository's ordinary mypy task; third-party packages retain their types.
[mypy-src.*]
follow_imports = silent
